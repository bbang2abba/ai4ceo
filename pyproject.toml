[project]
name = "ai4ceo"
version = "1.0"
description = "CEO를 위한 AI coding school"
authors = [{name = "장동인", email = "donchang0725@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13,<3.14"

# --- 핵심 종속성 (ref.py, app1.py, app2.py 실행에 필요한 패키지만 포함) ---
dependencies = [
    # LangChain 핵심 패키지
    "langchain>=1.2.6,<2.0",
    "langchain-core>=1.2.6,<2.0",
    "langchain-community>=0.4,<0.5",
    "langchain-openai>=1.1.6,<2.0",
    "langchain-anthropic>=1.3.1,<2.0",
    "langchain-google-genai>=4.2.0,<5.0",
    "langchain-perplexity",
    "langchain-upstage>=0.6.0",
    "langchain-text-splitters>=1.0.0,<2.0",
    # OpenAI 및 벡터 스토어
    "openai>=2.0,<3.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    # Streamlit 및 웹 프레임워크
    "streamlit>=1.53.0",
    # 데이터 처리
    "pandas>=2.2.2",
    "numpy>=2.2.2",
    # 머신러닝
    "scikit-learn>=1.6.0",
    # 데이터베이스
    "sqlalchemy>=2.0.31",
    "supabase>=2.10.0,<3.0",
    # PDF 처리 (ref.py의 PyPDFLoader용)
    "pypdf>=4.2.0",
    # 시각화 (app1.py용)
    "plotly>=6.5.0",
    "matplotlib>=3.10.1",
    "wordcloud>=1.9.5",
    # 유틸리티
    "python-dotenv>=1.1.0",
    "pydantic>=2.10.6",
    # 웹 검색
    "duckduckgo-search>=8.1.1",
    "beautifulsoup4>=4.14.3",
    "requests>=2.32.3",
    "langchain-ollama>=0.3,<1.0",
    "yt-dlp>=2026.3.17",
    "pydub>=0.25.1",
    "librosa>=0.11.0",
]

# --- UV 전용 설정: 패키지 빌드 에러 방지 ---
[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
